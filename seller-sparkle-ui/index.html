    <style>
      /* Instant branded paint before React boots (avoids blank/Lovable flash). */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0f172a;
        color: #94a3b8;
        font-family: Inter, system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
      }
      #boot-splash img {
        width: 96px;
        height: 96px;
        border-radius: 1rem;
        object-fit: cover;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-live="polite" aria-busy="true">
      <img src="/branding/blinksmed-logo.png" alt="BlinksMed" width="96" height="96" />
      <span>Loading BlinksMed…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
