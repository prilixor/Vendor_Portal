name: prilixor_vendor_mobile
description: BlinksMed Vendor mobile app (separate APK from Customer).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  jwt_decoder: ^2.0.1
  file_picker: 12.0.0-beta.7
  open_file: ^3.5.10
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  geolocator: ^13.0.4
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#0F172A"
    theme_color: "#00338D"
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
