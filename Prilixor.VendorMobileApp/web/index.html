<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BlinksMed vendor portal — manage rentals, orders, and inventory.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BlinksMed Vendor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BlinksMed Vendor</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #0F172A; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: #94A3B8; font-family: system-ui, sans-serif; font-size: 14px;
      background: #0F172A;
      transition: opacity 160ms ease-out;
    }
    #boot-splash.boot-splash--hide {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash img {
      width: 80px;
      height: auto;
      padding: 6px;
      box-sizing: border-box;
      border-radius: 12px;
      object-fit: contain;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <img src="splash_logo.png" alt="BlinksMed Vendor" width="80" height="73" />
    <span>Loading BlinksMed Vendor…</span>
  </div>
  <script>
    (function () {
      function dismissBootSplash() {
        var el = document.getElementById('boot-splash');
        if (!el) return;
        el.classList.add('boot-splash--hide');
        window.setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 200);
      }
      window.addEventListener('flutter-first-frame', dismissBootSplash, { once: true });
      // Keep splash until Flutter paints. Only fall back after a long debug cold-start.
      window.setTimeout(dismissBootSplash, 120000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
