<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BlinksMed vendor portal — manage rentals, orders, and inventory.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BlinksMed Vendor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BlinksMed Vendor</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #0F172A; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: #94A3B8; font-family: system-ui, sans-serif; font-size: 14px;
      background: #0F172A;
      transition: opacity 160ms ease-out;
    }
    #boot-splash.boot-splash--hide {
      opacity: 0;
      pointer-events: none;
    }
    .boot-mark {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boot-mark::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2.5px solid rgba(108, 99, 255, 0.16);
      border-top-color: #6C63FF;
      animation: boot-spin 0.8s linear infinite;
    }
    .boot-mark img {
      width: 44px;
      height: 44px;
      padding: 5px;
      box-sizing: border-box;
      border-radius: 12px;
      object-fit: contain;
      background: #fff;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="boot-mark">
      <img src="loader_mark.png?v=20260819p" alt="BlinksMed Vendor" width="44" height="44" />
    </div>
    <span>Loading BlinksMed Vendor…</span>
  </div>
  <script>
    (function () {
      function dismissBootSplash() {
        var el = document.getElementById('boot-splash');
        if (!el) return;
        el.classList.add('boot-splash--hide');
        window.setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 200);
      }
      window.addEventListener('flutter-first-frame', dismissBootSplash, { once: true });
      // Fallback if the event was missed (hot restart / delayed listener).
      window.setTimeout(dismissBootSplash, 12000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
